<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Precificação - Verk3D Print</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --primary-hover: #b71c1c;
            --secondary: #2e7d32;
            --secondary-hover: #1b5e20;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --border: #dee2e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 28px;
        }

        header p {
            color: #6c757d;
        }

        .grid {
            display: block;
        }

        /* Layout em tabelas simuladas para compatibilidade de fluxo */
        .main-table {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 20px 0;
        }

        .main-cell {
            display: table-cell;
            width: 50%;
            vertical-align: top;
        }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
            color: #495057;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: #fdfdfd;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        /* Listas e Histórico */
        ul {
            list-style: none;
        }

        .item-lista {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item-lista:hover {
            background-color: #f1f3f5;
        }

        .item-lista strong {
            color: var(--primary);
        }

        .flex-btn-group {
            margin-top: 10px;
        }

        .flex-btn-group button {
            width: 48%;
            float: left;
        }
        .flex-btn-group button:last-child {
            float: right;
        }
        .clear {
            clear: both;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Precificação Verk3D Print</h1>
            <p>Calcule orçamentos de impressão 3D e gerencie seu catálogo de modelos</p>
        </header>

        <div class="main-table">
            <div class="main-cell">
                
                <div class="card">
                    <h2>1. Selecionar ou Cadastrar Modelo</h2>
                    <div class="form-group">
                        <label for="modeloSelect">Carregar Modelo Salvo:</label>
                        <select id="modeloSelect" onchange="carregarModelo()">
                            <option value="">-- Selecione para autopreencher --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nomeModeloNovo">Nome do Modelo (para Salvar Novo):</label>
                        <input type="text" id="nomeModeloNovo" placeholder="Ex: Urubu do Flamengo">
                    </div>
                    <button class="btn btn-secondary" onclick="salvarModeloNoCatalogo()">Salvar Modelo no Catálogo</button>
                </div>

                <div class="card">
                    <h2>2. Dados da Impressão</h2>
                    <div class="form-group">
                        <label for="cliente">Nome do Cliente:</label>
                        <input type="text" id="cliente" placeholder="Ex: João Silva">
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso Estimado (g):</label>
                        <input type="number" id="peso" placeholder="Ex: 393" step="any">
                    </div>
                    <div class="form-group">
                        <label for="tempo">Tempo de Impressão (Horas):</label>
                        <input type="number" id="tempo" placeholder="Ex: 21" step="any">
                    </div>
                    
                    <div class="flex-btn-group">
                        <button class="btn btn-primary" onclick="gerarEsalvar()">Gerar PDF</button>
                        <button class="btn btn-secondary" style="background-color: #495057;" onclick="limparCampos()">Limpar</button>
                    </div>
                    <div class="clear"></div>
                </div>

            </div>

            <div class="main-cell">
                
                <div class="card">
                    <h2>Configurações de Custo Ocultas</h2>
                    <div class="form-group">
                        <label>Custo por Grama (Filamento): R$ 0,10 (R$ 100/kg)</label>
                        <label>Hora-Máquina Base: R$ 5,00/h</label>
                        <label>Margem de Lucro (Markup): 50%</label>
                    </div>
                </div>

                <div class="card">
                    <h2>Histórico de Orçamentos Salvos</h2>
                    <ul id="listaHistorico">
                        <li style="color:#6c757d; font-size:14px; padding: 10px;">Nenhum orçamento gerado ainda.</li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTES DE CONFIGURAÇÃO DE PREÇO ---
        const CUSTO_POR_GRAMA = 0.10;    // R$ 100 por kg / 1000g
        const VALOR_HORA_MAQUINA = 5.00; // Valor por hora equilibrado
        const MARGEM_LUCRO = 0.50;       // 50% de markup sobre o custo

        // --- INICIALIZAÇÃO DO SISTEMA ---
        window.onload = function() {
            atualizarSelectModelos();
            exibirHistorico();
        };

        // --- FUNÇÃO 1: SALVAR NOVO MODELO NO CATÁLOGO ---
        function salvarModeloNoCatalogo() {
            const nome = document.getElementById('nomeModeloNovo').value.trim();
            const peso = parseFloat(document.getElementById('peso').value) || 0;
            const tempo = parseFloat(document.getElementById('tempo').value) || 0;

            if (!nome) {
                alert("Por favor, digite um nome para registrar o modelo no catálogo.");
                return;
            }
            if (peso <= 0 || tempo <= 0) {
                alert("Preencha o Peso e o Tempo antes de salvar o modelo.");
                return;
            }

            const catalogo = JSON.parse(localStorage.getItem('verk3d_catalogo') || '[]');
            
            // Verifica se o modelo já existe para não duplicar
            const indexExistente = catalogo.findIndex(m => m.nome.toLowerCase() === nome.toLowerCase());
            const novoModelo = { nome, peso, tempo };

            if (indexExistente > -1) {
                catalogo[indexExistente] = novoModelo; // Atualiza se já existir
            } else {
                catalogo.push(novoModelo); // Adiciona novo
            }

            localStorage.setItem('verk3d_catalogo', JSON.stringify(catalogo));
            alert(`Modelo "${nome}" salvo com sucesso no catálogo!`);
            
            document.getElementById('nomeModeloNovo').value = "";
            atualizarSelectModelos();
        }

        // --- FUNÇÃO 2: ATUALIZAR DROPDOWN DE MODELOS ---
        function atualizarSelectModelos() {
            const select = document.getElementById('modeloSelect');
            select.innerHTML = '<option value="">-- Selecione para autopreencher --</option>';
            
            const catalogo = JSON.parse(localStorage.getItem('verk3d_catalogo') || '[]');
            
            catalogo.forEach((modelo, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${modelo.nome} (${modelo.peso}g | ${modelo.tempo}h)`;
                select.appendChild(opt);
            });
        }

        // --- FUNÇÃO 3: CARREGAR DADOS DO MODELO SELECIONADO ---
        function carregarModelo() {
            const select = document.getElementById('modeloSelect');
            const index = select.value;
            
            if (index === "") return;

            const catalogo = JSON.parse(localStorage.getItem('verk3d_catalogo') || '[]');
            const modelo = catalogo[index];

            if (modelo) {
                document.getElementById('peso').value = modelo.weight || modelo.peso;
                document.getElementById('tempo').value = modelo.time || modelo.tempo;
                // Preenche o campo de texto de orçamento caso o usuário queira usar o nome do modelo
                document.getElementById('cliente').value = "Orçamento: " + modelo.nome;
            }
        }

        // --- FUNÇÃO 4: CALCULAR, SALVAR NO HISTÓRICO E GERAR PDF ---
        function gerarEsalvar() {
            try {
                const clienteInput = document.getElementById('cliente').value;
                const cliente = clienteInput.trim() !== "" ? clienteInput.trim() : "Cliente_Oculto";
                const peso = parseFloat(document.getElementById('peso').value) || 0;
                const tempo = parseFloat(document.getElementById('tempo').value) || 0;

                if (peso <= 0 || tempo <= 0) {
                    alert("Por favor, preencha peso e tempo válidos para o cálculo.");
                    return;
                }

                // Cálculos de engenharia de custo
                const custoMaterial = peso * CUSTO_POR_GRAMA;
                const custoOperacao = tempo * VALOR_HORA_MAQUINA;
                const custoTotal = custoMaterial + custoOperacao;
                const valorFinal = custoTotal * (1 + MARGEM_LUCRO);

                // Armazenamento no histórico local
                const orcamento = {
                    cliente: cliente,
                    valor: valorFinal.toFixed(2),
                    data: new Date().toLocaleDateString()
                };

                const lista = JSON.parse(localStorage.getItem('verk3d_orcamentos') || '[]');
                lista.push(orcamento);
                localStorage.setItem('verk3d_orcamentos', JSON.stringify(lista));

                // Processamento de PDF via jsPDF de forma robusta
                if (window.jspdf && window.jspdf.jsPDF) {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(20);
                    doc.setTextColor(211, 47, 47); // Vermelho institucional Verk3D
                    doc.text("VERK3D PRINT - ORÇAMENTO", 10, 20);
                    
                    doc.setDrawColor(200, 200, 200);
                    doc.line(10, 25, 200, 25);

                    doc.setFontSize(12);
                    doc.setTextColor(33, 37, 41);
                    doc.text(`Identificação / Cliente: ${cliente}`, 10, 35);
                    doc.text(`Data de Emissão: ${orcamento.data}`, 10, 43);
                    
                    doc.setFontSize(14);
                    doc.text("Especificações do Projeto:", 10, 58);
                    doc.setFontSize(12);
                    doc.text(`- Consumo Estimado de Material: ${peso}g`, 15, 68);
                    doc.text(`- Tempo Estimado de Máquina: ${tempo} horas`, 15, 76);
                    
                    doc.line(10, 85, 200, 85);
                    doc.setFontSize(16);
                    doc.text(`VALOR TOTAL SUGERIDO: R$ ${valorFinal.toFixed(2)}`, 10, 98);

                    doc.save(`orcamento_${cliente.replace(/\s+/g, '_')}.pdf`);
                } else {
                    alert("Aviso: Falha ao carregar o motor de PDF externo. O histórico foi armazenado.");
                }

                exibirHistorico();

            } catch (err) {
                console.error("Erro no processamento:", err);
                alert("Houve uma falha interna na execução matemática.");
            }
        }

        // --- FUNÇÃO 5: RENDERIZAR HISTÓRICO NA TELA ---
        function exibirHistorico() {
            const listaHistorico = document.getElementById('listaHistorico');
            if (!listaHistorico) return;

            const lista = JSON.parse(localStorage.getItem('verk3d_orcamentos') || '[]');
            
            if (lista.length === 0) {
                listaHistorico.innerHTML = '<li style="color:#6c757d; font-size:14px; padding:10px;">Nenhum orçamento gerado ainda.</li>';
                return;
            }

            listaHistorico.innerHTML = '';
            // Renderiza invertido para ver o mais recente no topo
            lista.slice().reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-lista';
                li.innerHTML = `📅 ${item.data} | <strong>${item.cliente}</strong>: R$ ${item.valor}`;
                listaHistorico.appendChild(li);
            });
        }

        // --- FUNÇÃO 6: LIMPAR FORMULÁRIO ---
        function limparCampos() {
            document.getElementById('cliente').value = "";
            document.getElementById('peso').value = "";
            document.getElementById('tempo').value = "";
            document.getElementById('nomeModeloNovo').value = "";
            document.getElementById('modeloSelect').value = "";
        }
    </script>
</body>
</html>
