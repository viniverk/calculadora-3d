<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor 3D - Controle de Impressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>.transition-sidebar { transition: width 0.3s ease, margin-left 0.3s ease; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex">

    <div id="telaAutenticacao" class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl shadow-xl border border-gray-700 w-full">
        <h2 id="tituloAuth" class="text-2xl font-bold text-center text-blue-400 mb-6">Entrar no Sistema</h2>
        <div class="space-y-4">
            <input type="email" id="authEmail" class="w-full bg-gray-700 p-2 rounded border border-gray-600" placeholder="E-mail">
            <input type="password" id="authSenha" class="w-full bg-gray-700 p-2 rounded border border-gray-600" placeholder="Senha">
            <button id="btnAuthPrincipal" class="w-full bg-blue-600 py-2 rounded font-bold">Entrar</button>
            <button id="btnAlternarAuth" class="w-full text-sm text-gray-400">Não tem conta? Cadastre-se</button>
        </div>
    </div>

    <aside id="sidebarApp" class="fixed top-0 left-0 h-screen bg-gray-800 w-64 z-30 hidden border-r border-gray-700 flex flex-col">
        <div class="p-4 border-b border-gray-700 flex justify-between">
            <h1 class="font-bold text-blue-400">Gestor 3D</h1>
            <button id="btnToggleSidebar">◀</button>
        </div>
        <nav class="p-3 space-y-2">
            <button onclick="mudarAba('inserir-impressao')" class="w-full px-3 py-2 bg-blue-600 rounded">Impressões</button>
            <button onclick="mudarAba('vendas')" class="w-full px-3 py-2 hover:bg-gray-700 rounded">Vendas</button>
            <button onclick="mudarAba('filamentos')" class="w-full px-3 py-2 hover:bg-gray-700 rounded">Estoque</button>
        </nav>
        <div class="p-4 mt-auto border-t border-gray-700"><button id="btnSair" class="w-full bg-red-600/20 py-2 rounded">Sair</button></div>
    </aside>

    <main id="conteudoPainel" class="flex-1 p-8 ml-64 hidden w-full">
        <div id="view-inserir-impressao" class="aba-conteudo grid grid-cols-1 xl:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-fit xl:col-span-1 space-y-4">
                <input type="text" id="projNome" placeholder="Nome do Projeto" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-white">
                <select id="projStatus" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-white">
                    <option value="Aguardando Impressão">Aguardando Impressão</option>
                    <option value="Imprimindo">Imprimindo</option>
                    <option value="Montagem">Montagem</option>
                    <option value="Projeto Finalizado">Projeto Finalizado</option>
                    <option value="Vendido">Vendido</option>
                </select>
                <input type="file" id="projArquivo3mf" accept=".3mf" class="w-full text-xs text-gray-400">
                <p id="lblTxt3mfCarregado" class="text-[11px] text-gray-400 italic"></p>
                <button id="btnSalvarProjetoCompleto" class="w-full bg-blue-600 py-3 rounded font-bold">Salvar Projeto</button>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 xl:col-span-2">
                <h2 class="text-xl font-semibold text-teal-400 mb-4">Projetos em Portfólio</h2>
                <div id="listaProjetosSalvos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <button id="btnCarregarMais" onclick="carregarMaisProjetos()" class="w-full mt-4 bg-gray-700 text-sky-400 py-2 rounded">Ver mais projetos...</button>
            </div>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient("https://tacxvkvpnialzdhbhffc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhY3h2a3ZwbmlhbHpkaGJoZmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDAxOTIsImV4cCI6MjA5NDk3NjE5Mn0.KXZ6WqAcFtCciTnfD11hGzFMd-rW8x-bBKhppDt2vV0");
        let offset = 0;
        let projetosCacheLocal = [];
        let arquivo3mfBase64 = null;
        let nomeDo3mfProjeto = null;

        // PAGINAÇÃO E CARREGAMENTO
        async function carregarProjetos3d(reset = true) {
            if (reset) { offset = 0; projetosCacheLocal = []; }
            const { data, error } = await _supabase.from('projetos_3d').select('*').order('created_at', { ascending: false }).range(offset, offset + 9);
            if (error) return;
            if (reset) projetosCacheLocal = data || [];
            else projetosCacheLocal = [...projetosCacheLocal, ...data];
            renderizarProjetosOrdenados();
            const btn = document.getElementById('btnCarregarMais');
            if (data && data.length < 10) btn.classList.add('hidden'); else btn.classList.remove('hidden');
        }

        function carregarMaisProjetos() { offset += 10; carregarProjetos3d(false); }

        // DOWNLOAD BINÁRIO CORRETO
        window.baixarArquivoOriginal3mf = function(id) {
            const proj = projetosCacheLocal.find(p => p.id === id);
            if (!proj || !proj.arquivo_3mf_data) return alert('Nenhum arquivo 3mf anexado.');
            const base64 = proj.arquivo_3mf_data.includes(',') ? proj.arquivo_3mf_data.split(',')[1] : proj.arquivo_3mf_data;
            const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = proj.nome_arquivo_3mf || "projeto.3mf";
            link.click();
        };

        // RENDERIZAÇÃO COM STATUS COLORIDO
        function renderizarProjetosOrdenados() {
            const container = document.getElementById('listaProjetosSalvos');
            container.innerHTML = projetosCacheLocal.map(proj => {
                const statusColor = proj.status === 'Montagem' ? 'bg-purple-500/20 text-purple-400' : 'bg-gray-600/30 text-gray-400';
                return `
                    <div class="bg-gray-700 p-4 rounded border border-gray-600">
                        <h3 class="font-bold">${proj.nome_projeto}</h3>
                        <span class="text-[9px] ${statusColor} px-2 py-1 rounded uppercase">${proj.status}</span>
                        <button onclick="baixarArquivoOriginal3mf('${proj.id}')" class="text-xs text-sky-400 mt-2 block hover:underline">📦 Baixar .3mf</button>
                    </div>
                `;
            }).join('');
        }

        // --- RESTANTE DAS FUNÇÕES (LOGIN, ESTOQUE, VENDAS) ---
        // Mantenha as suas funções existentes aqui abaixo
        function mudarAba(aba) {
            document.querySelectorAll('.aba-conteudo').forEach(a => a.classList.add('hidden'));
            document.getElementById('view-' + aba).classList.remove('hidden');
        }
        
        // Listener de arquivo 3mf
        document.getElementById('projArquivo3mf').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            nomeDo3mfProjeto = file.name;
            const reader = new FileReader();
            reader.onload = evt => { arquivo3mfBase64 = evt.target.result; document.getElementById('lblTxt3mfCarregado').innerText = '✓ Carregado: ' + file.name; };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
