<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor 3D - Controle de Impressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>.transition-sidebar { transition: width 0.3s ease, margin-left 0.3s ease; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex">

    <div id="telaAutenticacao" class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl shadow-xl border border-gray-700 w-full">
        <h2 id="tituloAuth" class="text-2xl font-bold text-center text-blue-400 mb-6">Entrar no Sistema</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">E-mail</label>
                <input type="email" id="authEmail" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="seu@email.com">
            </div>
            
            <div id="containerSenha">
                <label class="text-sm font-medium mb-1 block">Senha</label>
                <input type="password" id="authSenha" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>
            
            <button id="btnAuthPrincipal" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">Entrar</button>
            
            <button id="btnGoogleAuth" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-2 px-4 rounded flex items-center justify-center gap-2 transition">
                Continuar com o Google
            </button>

            <button id="btnAlternarAuth" class="w-full text-sm text-gray-400 hover:underline mt-2">Não tem conta? Cadastre-se</button>
        </div>
    </div>

    <aside id="sidebarApp" class="fixed top-0 left-0 h-screen bg-gray-800 border-r border-gray-700 flex flex-col justify-between transition-sidebar w-64 z-30 hidden">
        <div>
            <div class="p-4 border-b border-gray-700">
                <h1 class="font-bold text-lg text-blue-400">Gestor 3D</h1>
            </div>
            <nav class="p-3 space-y-2">
                <button onclick="mudarAba('inserir-impressao')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition bg-blue-600 text-white item-menu-btn" data-aba="inserir-impressao">🚀 Impressões</button>
                <button onclick="mudarAba('vendas')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition hover:bg-gray-700 item-menu-btn" data-aba="vendas">💰 Vendas</button>
                <button onclick="mudarAba('filamentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition hover:bg-gray-700 item-menu-btn" data-aba="filamentos">🧵 Estoque</button>
                <button onclick="mudarAba('calculadora')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition hover:bg-gray-700 item-menu-btn" data-aba="calculadora">🧮 Calculadora/Orçamento</button>
            </nav>
        </div>
        <button id="btnSair" class="m-4 bg-red-900 text-red-200 py-2 rounded">Sair</button>
    </aside>

    <main id="conteudoPainel" class="flex-1 p-8 ml-64 hidden">
        </main>

    <script>
        const _supabase = supabase.createClient("SUA_URL_SUPABASE", "SUA_KEY_SUPABASE");
        let modoAbas = 'login';
        
        // CORREÇÃO DO CADASTRO: Login Automático
        document.getElementById('btnAuthPrincipal').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authSenha').value;
            
            if (modoAbas === 'login') {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert('Erro ao entrar: ' + error.message);
            } else {
                const { error } = await _supabase.auth.signUp({ email, password });
                if (error) {
                    alert('Erro ao cadastrar: ' + error.message);
                } else {
                    alert('Conta criada! Entrando...');
                    await _supabase.auth.signInWithPassword({ email, password });
                }
            }
        });

        // Alternar modo Login/Cadastro
        document.getElementById('btnAlternarAuth').addEventListener('click', () => {
            modoAbas = modoAbas === 'login' ? 'cadastro' : 'login';
            document.getElementById('tituloAuth').innerText = modoAbas === 'login' ? 'Entrar no Sistema' : 'Criar Conta';
        });
    </script>
</body>
</html>
