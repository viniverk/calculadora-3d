<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor 3D - Controle de Impressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>.transition-sidebar { transition: width 0.3s ease, margin-left 0.3s ease; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex">

    <div id="telaAutenticacao" class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl shadow-xl border border-gray-700 w-full">
        <h2 id="tituloAuth" class="text-2xl font-bold text-center text-blue-400 mb-6">Entrar no Sistema</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">E-mail</label>
                <input type="email" id="authEmail" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Senha</label>
                <input type="password" id="authSenha" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>
            <button id="btnAuthPrincipal" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">Entrar</button>
            <button id="btnGoogleAuth" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-2 px-4 rounded transition">Continuar com o Google</button>
            <button id="btnAlternarAuth" class="w-full text-sm text-gray-400 hover:underline">Não tem conta? Cadastre-se</button>
        </div>
    </div>

    <aside id="sidebarApp" class="fixed top-0 left-0 h-screen bg-gray-800 border-r border-gray-700 w-64 z-30 hidden">
        <div class="p-4 border-b border-gray-700"><h1 class="font-bold text-lg text-blue-400">Gestor 3D</h1></div>
        <nav class="p-3 space-y-2">
            <button onclick="mudarAba('inserir-impressao')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white">🚀 Impressões</button>
            <button onclick="mudarAba('vendas')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300">💰 Vendas</button>
            <button onclick="mudarAba('filamentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300">🧵 Estoque</button>
            <button onclick="mudarAba('calculadora')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300">🧮 Calculadora</button>
        </nav>
        <div class="absolute bottom-0 w-full p-4 border-t border-gray-700">
            <button id="btnSair" class="w-full bg-red-600/20 text-red-200 py-2 rounded text-sm font-bold">Sair do Sistema</button>
        </div>
    </aside>

    <main id="conteudoPainel" class="flex-1 p-8 ml-64 hidden w-full">
        <div id="view-inserir-impressao" class="aba-conteudo">...</div>
        <div id="view-vendas" class="aba-conteudo hidden">...</div>
        <div id="view-filamentos" class="aba-conteudo hidden">...</div>
        <div id="view-calculadora" class="aba-conteudo hidden">...</div>
    </main>

    <script>
        const SUPABASE_URL = "https://tacxvkvpnialzdhbhffc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhY3h2a3ZwbmlhbHpkaGJoZmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDAxOTIsImV4cCI6MjA5NDk3NjE5Mn0.KXZ6WqAcFtCciTnfD11hGzFMd-rW8x-bBKhppDt2vV0";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicialização garantida
        document.addEventListener('DOMContentLoaded', () => {
            const btnGoogle = document.getElementById('btnGoogleAuth');
            if (btnGoogle) {
                btnGoogle.addEventListener('click', async () => {
                    console.log("Iniciando login Google...");
                    const { error } = await _supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: 'https://viniverk.github.io/calculadora-3d/' }
                    });
                    if (error) {
                        console.error("Erro Google:", error.message);
                        alert("Erro Google: " + error.message);
                    }
                });
            }
        });

        function mudarAba(aba) {
            document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('hidden'));
            const view = document.getElementById('view-' + aba);
            if (view) view.classList.remove('hidden');
        }

        // Monitor de sessão
        _supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('telaAutenticacao').classList.add('hidden');
                document.getElementById('sidebarApp').classList.remove('hidden');
                document.getElementById('conteudoPainel').classList.remove('hidden');
            }
        });

        document.getElementById('btnSair').addEventListener('click', () => _supabase.auth.signOut());
    </script>
</body>
</html>
